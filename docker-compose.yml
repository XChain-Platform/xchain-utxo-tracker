version: '3'

services:
  xchain_utxo_tracker:
    build: .
    # The image bakes no .env (Dockerfile); the README's .env is handed to the
    # container here instead.
    env_file: .env
    # Compose's own stop wait is 10 s, which would SIGKILL a bulk-sync drain before it
    # removes the interrupted target DB. This matches the 120 s xchain-node stamps on
    # the container and must stay above SHUTDOWN_TIMEOUT_MS (default 100000), so the
    # drain ends in a logged exit before the daemon steps in; raise both together.
    stop_grace_period: 120s
    # Without this block the tracker is the one XChain service whose container
    # logs are unbounded: docker's json-file driver rotates nothing by default,
    # so a compose-run tracker grows until the host disk fills (spec
    # proactive-system-watch, 2.0.4/2.0.5). 30m x 10 = 300 MB matches the
    # decoder, encoder, explorer and sdk compose files. The tracker measured
    # 6.7 KB/h on regtest 2026-08-30; even at the 10x fleet inflation and 2x
    # headroom the 48 h floor asks for 6.4 MB, so this cap is a disk ceiling
    # rather than a retention limit.
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "10"
    volumes:
      - xchain_utxo_tracker_data:/data/
    networks: 
      - network1
    ports:
      - "3000:3000"
      
networks:
  network1:
    name: xchain_network
    external: true
    
volumes:
  xchain_utxo_tracker_data: